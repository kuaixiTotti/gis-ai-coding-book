# 教材使用的数据源清单
# 每项必须包含:id、name、source、license、chapter

datasets:
  - id: china-admin-2024
    name: 中国县级行政区划 2024(天地图,审图号 GS(2024)0650)
    chapter: [6, 8]
    source: "https://cloudcenter.tianditu.gov.cn/administrativeDivision/"
    publisher: 国家基础地理信息中心 / 国家地理信息公共服务平台(天地图)
    review_number: GS(2024)0650        # 审图号:边界合规,适合国内出版
    license: >-
      天地图账号登录后公开下载;审图号 GS(2024)0650。
      用于教学/科研可放心使用;商业出版前须按天地图服务条款再确认授权
      (见 docs/post-draft-backlog.md 的许可证核查项)。
    level: county                       # 县级
    crs: "EPSG:4490"                    # CGCS2000(实测文件声明,非网传的 WGS84)
    format: geojson
    size: "9.5MB"
    download_script: data/scripts/download_china_admin.py
    checksum_sha256: "91edf86abe109a1de33052977852e37f848f350d37ae069b40e0d80dcc2a97d3"
    # 实测结构:2898 个要素 = 2891 县级面(MultiPolygon)+ 7 条境界线(MultiLineString)
    # 属性字段:name(名称)、gb(国标码,"156"+GB/T 2260 六位码;境界线的 gb 为空)
    # 这些"面线混排 + 空值 + 编码解析"正好用作 ch06 GeoPandas 清洗练习素材

  - id: beijing-poi-osm
    name: 北京 POI(OSM 提取)
    chapter: [5, 8]
    source: overpass-api
    license: ODbL
    size: "~120MB"
    format: geojson
    download_script: data/scripts/fetch_beijing_poi.py
