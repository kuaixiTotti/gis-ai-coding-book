<!DOCTYPE html>
<!--
  阶段 3:加载 GeoJSON 数据
  对应 Prompt 3

  在阶段 2 基础上加载 ../../data/campus.geojson,
  把每个要素以默认蓝色图钉绘制,点击弹出 popup。

  注意:用 file:// 协议直接打开本文件可能因 CORS 报错。
  建议在父目录运行:
    cd ../..
    python -m http.server 8000
  然后访问 http://localhost:8000/steps/step-03-geojson/

  或者把 data/campus.geojson 复制到本目录用相对路径。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园地图 step-03:加载 GeoJSON</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── 底图(简化为只用 OSM) ────────────────────
    const osm = L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap', maxZoom: 19 }
    );

    const amapRoad = L.tileLayer(
      'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      { subdomains: ['1', '2', '3', '4'], attribution: '© 高德地图', maxZoom: 18 }
    );

    const map = L.map('map', {
      center: [39.995, 116.308],
      zoom: 15,
      layers: [osm]
    });

    L.control.layers({ "OpenStreetMap": osm, "高德道路图": amapRoad }).addTo(map);

    // ─── 加载 GeoJSON ─────────────────────────────────
    // 路径相对于当前 HTML 文件
    fetch('../../data/campus.geojson')
      .then(response => {
        // 显式检查 HTTP 状态,否则 404 也会进入 .then
        if (!response.ok) {
          throw new Error(`加载失败:HTTP ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        L.geoJSON(data, {
          // 每个要素被添加到地图时的回调
          onEachFeature: (feature, layer) => {
            const { name, category, desc } = feature.properties;
            // 绑定弹窗
            layer.bindPopup(`
              <h3 style="margin:0 0 6px;">${name}</h3>
              <p style="margin:0;color:#666;font-size:13px;">
                <strong>类别:</strong>${category}
              </p>
              <p style="margin:6px 0 0;font-size:13px;">${desc}</p>
            `);
          }
        }).addTo(map);
      })
      .catch(err => {
        // 显式 catch:即使浏览器 Network 显示 404,
        // 这一步会让错误也出现在 Console
        console.error('加载 GeoJSON 失败:', err);
      });
  </script>
</body>
</html>
