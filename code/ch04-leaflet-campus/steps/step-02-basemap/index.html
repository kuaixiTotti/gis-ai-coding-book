<!DOCTYPE html>
<!--
  阶段 2:增加底图切换控件
  对应 Prompt 2

  本阶段在阶段 1 的基础上增加 4 种底图,
  右上角出现切换控件,用户可以切换底图风格。

  注意:OSM 底图用 WGS84 坐标系,高德底图用 GCJ-02。
  切换到高德底图时北大位置会偏移几百米,这是坐标系差异导致,
  不是 bug。第 8 章会系统讲坐标系处理。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园地图 step-02:多底图切换</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── 1. 定义各个底图图层 ──────────────────────────
    // OpenStreetMap:全球开源,中国境内细节稀疏
    const osm = L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap', maxZoom: 19 }
    );

    // 高德道路图:中文标注,国内详细
    // 注意:GCJ-02 坐标系
    const amapRoad = L.tileLayer(
      'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      {
        subdomains: ['1', '2', '3', '4'],
        attribution: '© 高德地图',
        maxZoom: 18
      }
    );

    // 高德卫星图
    const amapSatellite = L.tileLayer(
      'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      {
        subdomains: ['1', '2', '3', '4'],
        attribution: '© 高德地图',
        maxZoom: 18
      }
    );

    // Carto 深色风格:简洁、适合数据叠加
    const cartoDark = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
      { attribution: '© CARTO', maxZoom: 19 }
    );

    // ─── 2. 创建地图,默认加载 OSM ──────────────────
    const map = L.map('map', {
      center: [39.995, 116.308],
      zoom: 15,
      layers: [osm]   // 默认显示的图层
    });

    // ─── 3. 图层切换控件 ──────────────────────────────
    const baseMaps = {
      "OpenStreetMap": osm,
      "高德道路图": amapRoad,
      "高德卫星图": amapSatellite,
      "Carto 深色": cartoDark
    };

    L.control.layers(baseMaps).addTo(map);
  </script>
</body>
</html>
