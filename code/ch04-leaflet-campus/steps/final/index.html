<!DOCTYPE html>
<!--
  最终版本:校园地图 v1
  对应 Prompt 1-7 全部内容

  本文件是 ch04-leaflet-campus 项目的最终交付物。
  包含:
  - 4 种底图切换
  - 按类别着色的圆点 POI
  - 鼠标悬停高亮 + tooltip
  - 点击弹出详情 popup
  - 右下角图例

  运行方式:
    cd ../..  (回到 ch04-leaflet-campus 目录)
    python -m http.server 8000
    浏览器打开 http://localhost:8000/steps/final/
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园地图 v1</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }

    .info.legend {
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      font-size: 13px;
      line-height: 1.6;
    }
    .info.legend h4 {
      margin: 0 0 8px;
      font-size: 13px;
    }
    .info.legend div {
      display: flex;
      align-items: center;
      margin: 4px 0;
    }
    .info.legend span {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ═══════════════════════════════════════════════════
    // 1. 底图定义
    // ═══════════════════════════════════════════════════
    const osm = L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap', maxZoom: 19 }
    );

    const amapRoad = L.tileLayer(
      'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      { subdomains: ['1', '2', '3', '4'], attribution: '© 高德地图', maxZoom: 18 }
    );

    const amapSatellite = L.tileLayer(
      'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      { subdomains: ['1', '2', '3', '4'], attribution: '© 高德地图', maxZoom: 18 }
    );

    const cartoDark = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
      { attribution: '© CARTO', maxZoom: 19 }
    );

    // ═══════════════════════════════════════════════════
    // 2. 创建地图
    // ═══════════════════════════════════════════════════
    const map = L.map('map', {
      center: [39.995, 116.308],
      zoom: 15,
      layers: [osm]
    });

    L.control.layers({
      "OpenStreetMap": osm,
      "高德道路图": amapRoad,
      "高德卫星图": amapSatellite,
      "Carto 深色": cartoDark
    }).addTo(map);

    // ═══════════════════════════════════════════════════
    // 3. POI 数据
    // ═══════════════════════════════════════════════════
    const categoryColors = {
      '景观': '#2ecc71',
      '建筑': '#3498db',
      '餐饮': '#e74c3c'
    };

    fetch('../../data/campus.geojson')
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) => {
            const color = categoryColors[feature.properties.category] || '#95a5a6';
            return L.circleMarker(latlng, {
              radius: 8,
              fillColor: color,
              color: '#fff',
              weight: 2,
              fillOpacity: 0.9
            });
          },
          onEachFeature: (feature, layer) => {
            const { name, category, desc } = feature.properties;

            // 点击弹出详情
            layer.bindPopup(`
              <h3 style="margin:0 0 6px;">${name}</h3>
              <p style="margin:0;color:#666;font-size:13px;">
                <strong>类别:</strong>${category}
              </p>
              <p style="margin:6px 0 0;font-size:13px;">${desc}</p>
            `);

            // 悬停显示 tooltip(只显示名字)
            layer.bindTooltip(name, {
              direction: 'top',
              offset: [0, -10]
            });

            // 悬停时高亮:半径变大,描边加粗
            layer.on('mouseover', (e) => {
              e.target.setStyle({ radius: 12, weight: 3 });
            });
            layer.on('mouseout', (e) => {
              e.target.setStyle({ radius: 8, weight: 2 });
            });
          }
        }).addTo(map);
      })
      .catch(err => console.error('加载 GeoJSON 失败:', err));

    // ═══════════════════════════════════════════════════
    // 4. 图例
    // ═══════════════════════════════════════════════════
    const legend = L.control({ position: 'bottomright' });

    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info legend');
      div.innerHTML = `
        <h4>类别</h4>
        <div><span style="background:#2ecc71"></span>景观</div>
        <div><span style="background:#3498db"></span>建筑</div>
        <div><span style="background:#e74c3c"></span>餐饮</div>
      `;
      return div;
    };

    legend.addTo(map);
  </script>
</body>
</html>
