<!DOCTYPE html>
<!--
  阶段 1:最小可运行的 Leaflet 地图
  对应 Prompt 1(见 ../../PROMPTS.md)

  这是整个项目的起点。只有一张以北京大学为中心的 OSM 底图。
  浏览器里直接打开本文件就能看到地图。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园地图 step-01:最小地图</title>

  <!-- Leaflet 的 CSS,必须在 JS 之前加载 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    /* 让地图容器占满整个视口 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 地图容器:必须有明确的高度 -->
  <div id="map"></div>

  <!-- Leaflet 的 JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 创建地图实例
    // 注意:setView 接收 [纬度, 经度],纬度在前!
    // 这和 GeoJSON 的 [经度, 纬度] 顺序相反,容易搞错。
    const map = L.map('map').setView([39.995, 116.308], 15);

    // 添加 OpenStreetMap 底图
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);
  </script>
</body>
</html>
