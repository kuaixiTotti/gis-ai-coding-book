<!DOCTYPE html>
<!--
  阶段 4:分类着色 + 图例
  对应 Prompt 4 和 Prompt 5

  在阶段 3 基础上:
  - 把默认蓝色图钉换成按 category 着色的圆点
  - 右下角加一个看起来像卡片的图例
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园地图 step-04:分类着色</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }

    /* 自定义图例样式 */
    .info.legend {
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      font-size: 13px;
      line-height: 1.6;
    }
    .info.legend h4 {
      margin: 0 0 8px;
      font-size: 13px;
    }
    .info.legend div {
      display: flex;
      align-items: center;
      margin: 4px 0;
    }
    .info.legend span {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── 底图 ─────────────────────────────────────────
    const osm = L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap', maxZoom: 19 }
    );

    const map = L.map('map', {
      center: [39.995, 116.308],
      zoom: 15,
      layers: [osm]
    });

    // ─── 类别 → 颜色映射 ──────────────────────────────
    const categoryColors = {
      '景观': '#2ecc71',
      '建筑': '#3498db',
      '餐饮': '#e74c3c'
    };

    // ─── 加载 GeoJSON 并分类着色 ──────────────────────
    fetch('../../data/campus.geojson')
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        L.geoJSON(data, {
          // pointToLayer:决定每个点如何创建图层
          // 这里我们把默认的图钉换成圆点
          pointToLayer: (feature, latlng) => {
            const color = categoryColors[feature.properties.category] || '#95a5a6';
            return L.circleMarker(latlng, {
              radius: 8,
              fillColor: color,
              color: '#fff',
              weight: 2,
              fillOpacity: 0.9
            });
          },
          onEachFeature: (feature, layer) => {
            const { name, category, desc } = feature.properties;
            layer.bindPopup(`
              <h3 style="margin:0 0 6px;">${name}</h3>
              <p style="margin:0;color:#666;font-size:13px;">
                <strong>类别:</strong>${category}
              </p>
              <p style="margin:6px 0 0;font-size:13px;">${desc}</p>
            `);
          }
        }).addTo(map);
      })
      .catch(err => console.error('加载 GeoJSON 失败:', err));

    // ─── 自定义图例 ───────────────────────────────────
    const legend = L.control({ position: 'bottomright' });

    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info legend');
      div.innerHTML = `
        <h4>类别</h4>
        <div><span style="background:#2ecc71"></span>景观</div>
        <div><span style="background:#3498db"></span>建筑</div>
        <div><span style="background:#e74c3c"></span>餐饮</div>
      `;
      return div;
    };

    legend.addTo(map);
  </script>
</body>
</html>
